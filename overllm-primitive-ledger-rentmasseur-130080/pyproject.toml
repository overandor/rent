[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overllm-kpi-primitive-ledger"
version = "0.1.0"
description = "Reproducible KPI derivative repo for RentMasseur contact-action intelligence and OverLLM primitive receipts."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
overllm-kpi = "overllm_kpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
